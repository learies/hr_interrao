{% extends "base.html" %}

{% block title %}Список сотрудников{% endblock %}

{% block content %}
    <h1>Список сотрудников</h1>
    <ul>
        {% for worker in pagination.items %}
            <li>
                <a href="{{ url_for('workers_views.get_worker', worker_id=worker.id) }}">{{ worker.name }}</a>
            </li>
        {% endfor %}
    </ul>
    {% include "includes/paginations.html" %}
{% endblock %}
